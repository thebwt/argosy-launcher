name: Grind HUD debug build

# Debug APK for thebwt's Shield, signed with a fixed debug key (repo secret
# GRINDHUD_DEBUG_KEYSTORE, base64 JKS, standard android/androiddebugkey
# passwords) so `adb install -r` can update it in place.

on:
  push:
    branches: [grindhud]
  workflow_dispatch:

concurrency:
  group: grindhud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install fixed debug keystore
        env:
          KS: ${{ secrets.GRINDHUD_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: argosy-grindhud-debug
          path: app/build/outputs/apk/debug/*.apk
