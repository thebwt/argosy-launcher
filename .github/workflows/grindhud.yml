name: Grind HUD build

# thebwt's personal Argosy: latest upstream release + the grindhud commits,
# with the Grind HUD PCSX ReARMed core bundled. Signed with a fixed key (repo
# secret GRINDHUD_DEBUG_KEYSTORE: base64 JKS, android/androiddebugkey) so it
# installs over "Argosy DBG" and every later build updates in place.
#
# Runs on pushes to grindhud, daily (picks up new upstream releases and core
# commits), and by hand. Publishes a GitHub release only when something changed.

on:
  push:
    branches: [grindhud]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if nothing changed'
        type: boolean
        default: false

concurrency:
  group: grindhud-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  CORE_REPO: thebwt/pcsx_rearmed
  CORE_BRANCH: grindhud
  UPSTREAM: https://github.com/rommapp/argosy-launcher.git
  # SHA-256 of the androiddebugkey cert in GRINDHUD_DEBUG_KEYSTORE
  EXPECTED_CERT: 6f43fb451c385192abbd29b0477bc6c3b55d822b9f0c0fafdb9923367640bd84

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out grindhud
        uses: actions/checkout@v4
        with:
          ref: grindhud
          fetch-depth: 0
          submodules: recursive

      - name: Put our commits on top of the latest upstream release
        id: base
        run: |
          set -euo pipefail
          git config user.name "grindhud-ci"
          git config user.email "grindhud-ci@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch -q upstream main --tags
          TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Ev -- '-(beta|rc|alpha)' | head -1)
          OURS=$(git rev-list --reverse upstream/main..HEAD)
          echo "upstream release: $TAG"
          echo "our commits:"; git log --oneline upstream/main..HEAD
          git checkout -q -b build "$TAG"
          git submodule update --init --recursive -q
          for c in $OURS; do
            git cherry-pick -x "$c" || { echo "::error::commit $c does not apply on $TAG"; exit 1; }
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ours=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "patch=$(git diff "$TAG" HEAD | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Build the Grind HUD core (arm64)
        id: core
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$CORE_BRANCH" "https://github.com/$CORE_REPO.git" /tmp/core
          CORE_SHA=$(git -C /tmp/core rev-parse --short HEAD)
          "$ANDROID_NDK_HOME/ndk-build" -j"$(nproc)" --no-print-directory -C /tmp/core/jni APP_ABI=arm64-v8a
          mkdir -p app/src/grindhud/jniLibs/arm64-v8a
          cp /tmp/core/libs/arm64-v8a/libretro.so app/src/grindhud/jniLibs/arm64-v8a/libpcsx_rearmed_libretro_android.so
          echo "sha=$CORE_SHA" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELTAG="gh-${{ steps.base.outputs.tag }}-p${{ steps.base.outputs.patch }}-core${{ steps.core.outputs.sha }}"
          echo "reltag=$RELTAG" >> "$GITHUB_OUTPUT"
          if gh release view "$RELTAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "nothing changed ($RELTAG exists)"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.plan.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install fixed signing key
        if: steps.plan.outputs.publish == 'true'
        env:
          KS: ${{ secrets.GRINDHUD_DEBUG_KEYSTORE }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/grindhud.keystore"
          echo "GRINDHUD_KEYSTORE=$RUNNER_TEMP/grindhud.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/grindhud.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build APK
        if: steps.plan.outputs.publish == 'true'
        env:
          GRINDHUD_BUILD: ${{ github.run_number }}
        run: |
          # R8 runs out of memory with the repo's 3 GB daemon heap
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          ./gradlew assembleGrindhud

      - name: Check the core is inside
        if: steps.plan.outputs.publish == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/grindhud/*.apk | head -1)
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpcsx_rearmed_libretro_android.so'
          # every build must carry the same certificate or it can't update in place
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "signed with $GOT"
          [ "$GOT" = "$EXPECTED_CERT" ] || { echo "::error::wrong signing cert $GOT"; exit 1; }
          cp "$APK" argosy-grindhud.apk

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.plan.outputs.reltag }}" argosy-grindhud.apk \
            -R "$GITHUB_REPOSITORY" --target grindhud \
            --title "Argosy GH ${{ steps.base.outputs.tag }} (run ${{ github.run_number }})" \
            --notes "Upstream ${{ steps.base.outputs.tag }} + grindhud patch ${{ steps.base.outputs.patch }}; core $CORE_REPO@${{ steps.core.outputs.sha }}."
